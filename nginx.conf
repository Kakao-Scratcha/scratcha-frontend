# 워커 프로세스 설정 (2GB RAM 환경)
worker_processes 2;  # 4 vCPU → 2 워커 (안정적)

events {
    worker_connections 65536;  # 262,144 → 65,536로 완화 (2GB RAM 환경)
    use epoll;  # Linux에서 고성능 이벤트 모델
    multi_accept on;  # 여러 연결을 한 번에 accept
    accept_mutex off;  # 뮤텍스 비활성화로 성능 향상
}

http {
    
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 2GB RAM 환경 메모리 사용량 설정
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 180;  # 300 → 180으로 완화 (3분 연결 유지)
    keepalive_requests 50000;  # 100,000 → 50,000으로 완화

    # DNS resolver 추가 (쿠버네티스 DNS)
    resolver 10.96.0.10 valid=30s;
    resolver_timeout 10s;

    # 로그 설정
    log_format main "$remote_addr - $remote_user [$time_local] \"$request\" "
                    "$status $body_bytes_sent \"$http_referer\" "
                    "\"$http_user_agent\" \"$http_x_forwarded_for\" "
                    "rt=$request_time uct=\"$upstream_connect_time\" "
                    "uht=\"$upstream_header_time\" urt=\"$upstream_response_time\"";

    access_log /var/log/nginx/access.log main buffer=256k flush=10s;
    error_log /var/log/nginx/error.log warn;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 서버 설정
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # LB 감지 변수 설정
        set $is_lb "false";
        set $is_https "false";
        
        # X-Forwarded-Proto 헤더가 있으면 LB 사용 중
        if ($http_x_forwarded_proto != "") {
            set $is_lb "true";
        }
        
        # HTTPS 감지
        if ($http_x_forwarded_proto = "https") {
            set $is_https "true";
        }
        if ($scheme = "https") {
            set $is_https "true";
        }

        # 정적 파일 캐싱
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
        }

        # 설정 API 엔드포인트 (환경변수를 JSON으로 반환)
        location /api/config {
            access_log off;
            add_header Content-Type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            
            # 기본값 설정 (환경변수는 docker-entrypoint.sh에서 처리)
            set $api_url "/api";  # 상대 경로로 변경
            set $env_name "production";
            
            # JSON 응답 반환
            return 200 "{\"apiUrl\":\"$api_url\",\"environment\":\"$env_name\"}";
        }

        # API 프록시 (백엔드 서비스로 프록시)
        location /api/ {
            # 기본 백엔드 서버 설정 (docker-entrypoint.sh에서 치환됨)
            set $backend_server "http://10.0.129.24:8001";  # 기본값을 현재 사용 중인 IP로 변경
            
            # 백엔드 서버로 프록시 (URI 제거하여 전체 경로 전달)
            proxy_pass $backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # 타임아웃 설정 최적화
            proxy_connect_timeout 60s;  
            proxy_send_timeout 60s;    
            proxy_read_timeout 60s;    
            
            # 2GB RAM 환경 버퍼링 설정
            proxy_buffering on;
            proxy_buffer_size 8k;   # 16k → 8k로 완화
            proxy_buffers 8 8k;     # 16 16k → 8 8k로 완화
            proxy_busy_buffers_size 16k;  # 32k → 16k로 완화
            
            # 커넥션 재사용
            proxy_set_header Connection "";
        }

        # 헬스체크 엔드포인트
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # SPA 라우팅 - 모든 요청을 index.html로 리다이렉트
        location / {
            try_files $uri $uri/ /index.html;
            
            # 보안 헤더
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
            
            # HSTS 헤더 (HTTPS일 때만)
            if ($is_https = "true") {
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            }
            
            # 보안: 숨겨진 파일 접근 차단
            location ~ /\. {
                deny all;
            }
        }

        # 에러 페이지
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # 2GB RAM 환경 클라이언트 설정
    client_max_body_size 20M;  # 50M → 20M으로 완화
    client_body_timeout 20;  # 30 → 20으로 완화
    client_header_timeout 20;  # 30 → 20으로 완화
    client_body_buffer_size 5M;  # 10M → 5M으로 완화
    client_header_buffer_size 8k;  # 16k → 8k로 완화
    large_client_header_buffers 8 16k;  # 16 32k → 8 16k로 완화
}