<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="캡차 서비스 관리 플랫폼" />
    <meta name="keywords" content="캡차, 보안, 인증" />
    <meta name="author" content="scratCHA Team" />

    <!-- 캐시 최적화 메타 태그 -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000" />
    <meta http-equiv="Expires" content="31536000" />

    <!-- 로컬 폰트 사용 -->
    <title>scratCHA</title>

    <!-- 폰트 preload - LCP 개선 -->
    <link
      rel="preload"
      href="/fonts/NotoSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/NotoSans-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/NotoSans-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- 로컬 폰트 정의 -->
    <style>
      /* Noto Sans KR 폰트 정의 */
      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/NotoSans-Regular.woff2") format("woff2");
      }

      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/NotoSans-Medium.woff2") format("woff2");
      }

      /* SemiBold (600) 대신 Medium (500) 사용 */
      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/NotoSans-Medium.woff2") format("woff2");
      }

      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 350;
        font-display: swap;
        src: url("/fonts/NotoSans-DemiLight.woff2") format("woff2");
      }

      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 700;
        font-display: optional;
        src: url("/fonts/NotoSans-Bold.woff2") format("woff2");
      }

      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url("/fonts/NotoSans-Light.woff2") format("woff2");
      }

      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 100;
        font-display: swap;
        src: url("/fonts/NotoSans-Thin.woff2") format("woff2");
      }

      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url("/fonts/NotoSans-Black.woff2") format("woff2");
      }

      /* 폰트 패밀리 설정 */
      body {
        font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans",
          "Droid Sans", "Helvetica Neue", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
